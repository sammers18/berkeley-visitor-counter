variables:
  # App config
  AWS_DEFAULT_REGION: "ap-southeast-1"
  APP_NAME: "berkeley-visitor-counter"
  DOCKER_REGISTRY: "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"

  # Image versions
  PYTHON_IMAGE: "python:3.12-slim"
  DOCKER_IMAGE: "docker:24.0.5"
  DOCKER_BUILD_IMAGE: "docker:24.0.5-dind"
  K8S_IMAGE: "alpine/k8s:1.29.2"
  REDIS_IMAGE: "redis:7-alpine"

  # Docker-in-Docker config
  DOCKER_HOST: "tcp://docker:2376"
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

  # Cluster config
  EKS_CLUSTER_PREFIX: "berkeley"
  ROLLOUT_TIMEOUT: "120s"
  # Define tag
  IMAGE_TAG: "${DOCKER_REGISTRY}/${APP_NAME}:${CI_COMMIT_SHORT_SHA}"
  CACHE_TAG: "${DOCKER_REGISTRY}/${APP_NAME}:latest"

stages:
  - build
  - test
  - deploy

# ===================== REUSABLE AUTH =====================
.aws_oidc_auth:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  before_script:
    - apk add --no-cache aws-cli gettext
    - >
      export $(aws sts assume-role-with-web-identity
        --role-arn "${AWS_ROLE_ARN}"
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}"
        --web-identity-token "${GITLAB_OIDC_TOKEN}"
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]'
        --output text | awk '{print "AWS_ACCESS_KEY_ID="$1"\nAWS_SECRET_ACCESS_KEY="$2"\nAWS_SESSION_TOKEN="$3}')

# ===================== BUILD STAGE =====================
build:
  stage: build
  image: ${DOCKER_IMAGE}
  services:
    - name: ${DOCKER_BUILD_IMAGE}
      alias: docker
  extends: .aws_oidc_auth
  script:
    # Wait for Docker daemon to be ready (prevents connection errors)
    - until docker info > /dev/null 2>&1; do sleep 1; done
    - aws ecr get-login-password --region ${AWS_DEFAULT_REGION} | docker login --username AWS --password-stdin ${DOCKER_REGISTRY}
    - docker pull ${CACHE_TAG} || true
    - >
      docker build
      --cache-from ${CACHE_TAG}
      -t ${IMAGE_TAG}
      -t ${CACHE_TAG} .
    - docker push ${IMAGE_TAG}
    - docker push ${CACHE_TAG}
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|non-prod|prod)$/
    - if: $CI_MERGE_REQUEST_IID

# ===================== TEST STAGE =====================
unit_test:
  stage: test
  image: ${PYTHON_IMAGE}
  script:
    - pip install -r requirements.txt pytest
    - python -m pytest tests/ -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH

integration_test:
  stage: test
  image: ${PYTHON_IMAGE}
  services:
    - name: ${REDIS_IMAGE}
      alias: redis
  variables:
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  script:
    - pip install -r requirements.txt pytest requests
    - python -m pytest tests/test_integration.py -v
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH

# ===================== DEPLOY TEMPLATE =====================
.deploy_template:
  stage: deploy
  image: ${K8S_IMAGE}
  extends: .aws_oidc_auth
  needs:
    - job: build
      artifacts: false
      optional: true
  script:
    - aws eks update-kubeconfig --region ${AWS_DEFAULT_REGION} --name ${EKS_CLUSTER_NAME}
    # Verify image exists in ECR before deploying
    - aws ecr describe-images --repository-name ${APP_NAME} --image-ids imageTag=${CI_COMMIT_SHORT_SHA} --region ${AWS_DEFAULT_REGION}
    - envsubst '${IMAGE_TAG} ${APP_NAME} ${DEPLOY_NAMESPACE}' < k8s-deployment.yaml > deployment.yaml
    - kubectl apply -f deployment.yaml -n ${DEPLOY_NAMESPACE}
    - kubectl rollout status deployment/${APP_NAME} -n ${DEPLOY_NAMESPACE} --timeout=${ROLLOUT_TIMEOUT}

# ===================== DEPLOY JOBS =====================
deploy_dev:
  extends: .deploy_template
  variables:
    EKS_CLUSTER_NAME: "${EKS_CLUSTER_PREFIX}-eks-cluster"
    DEPLOY_NAMESPACE: "dev"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_nonprod:
  extends: .deploy_template
  variables:
    EKS_CLUSTER_NAME: "${EKS_CLUSTER_PREFIX}-nonprod"
    DEPLOY_NAMESPACE: "non-prod"
  rules:
    - if: $CI_COMMIT_BRANCH == "non-prod"
      when: manual

deploy_prod:
  extends: .deploy_template
  variables:
    EKS_CLUSTER_NAME: "${EKS_CLUSTER_PREFIX}-prod"
    DEPLOY_NAMESPACE: "prod"
  rules:
    - if: $CI_COMMIT_BRANCH == "prod"
      when: manual
